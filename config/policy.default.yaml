policy_name: baseline_v1

# --- Decision thresholds ---
approve_min: 0.65
review_min: 0.50

# --- Tier cutoffs ---
prime_cut: 0.70
near_cut: 0.50

# --- Loss parameters ---
avg_loan_amount: 10000
lgd: 0.45
# lgd_source: Basel II/III supervisory floor for senior unsecured consumer credit.
# Sensitivity range: 0.30 (secured / high-recovery) to 0.70 (charged-off unsecured).
# Replace with portfolio-specific recovery data when available.

# --- Loan term and revenue (used for lifetime EL and break-even analysis) ---
tenor_months: 36
# revenue_per_loan: illustrative total interest income over the loan term.
# Basis: 10% annual rate × $10,000 average balance × 3 years ≈ $3,000.
# Adjust to actual weighted-average coupon and average outstanding balance.
revenue_per_loan: 3000.0
